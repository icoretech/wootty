x-wootty-common: &wootty-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &wootty-environment
    WOOTTY_AUTH_TOKEN: ${WOOTTY_AUTH_TOKEN:?Set WOOTTY_AUTH_TOKEN before starting WooTTY}
    WOOTTY_HOST: 0.0.0.0
    WOOTTY_PORT: 8080

services:
  wootty:
    <<: *wootty-common
    image: wootty:local-default
    ports:
      - "127.0.0.1:8080:8080"

  wootty-bash:
    <<: *wootty-common
    image: wootty:local-bash
    profiles: ["bash"]
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      <<: *wootty-environment
      WOOTTY_COMMAND: /bin/bash
      WOOTTY_COMMAND_ARGS: -l

  wootty-ssh:
    <<: *wootty-common
    image: wootty:local-ssh
    profiles: ["ssh"]
    build:
      context: .
      dockerfile: Dockerfile
      target: final-openssh
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      <<: *wootty-environment
      WOOTTY_COMMAND: /usr/bin/ssh
      WOOTTY_COMMAND_ARGS: ${WOOTTY_SSH_ARGS:--o StrictHostKeyChecking=accept-new user@example.com}

  wootty-retention:
    <<: *wootty-common
    image: wootty:local-retention
    profiles: ["retention"]
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      <<: *wootty-environment
      WOOTTY_DETACHED_TTL_MS: "259200000"

  wootty-fake-pty:
    <<: *wootty-common
    image: wootty:local-fake-pty
    profiles: ["test"]
    ports:
      - "127.0.0.1:8084:8080"
    environment:
      <<: *wootty-environment
      WOOTTY_FAKE_PTY: "1"
