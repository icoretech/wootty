name: CI

on:
  pull_request:
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - package.json
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint Test Build
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        run: npm install --global --allow-scripts=pnpm "$(node -p 'require("./package.json").packageManager')"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (check-only + typecheck)
        run: pnpm lint:ci

      - name: Unit and integration tests
        run: pnpm test

      - name: Go race tests
        run: cd apps/server && go test -race -shuffle=on -count=1 ./...

      - name: Build standalone binary
        run: pnpm build:binary

      - name: Upload E2E server
        uses: actions/upload-artifact@v7
        with:
          name: wootty-e2e-server
          path: apps/server/woottyd
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
          overwrite: true

  e2e:
    name: Playwright E2E
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-26.04
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        run: npm install --global --allow-scripts=pnpm "$(node -p 'require("./package.json").packageManager')"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download E2E server
        uses: actions/download-artifact@v8
        with:
          name: wootty-e2e-server
          path: apps/server

      - name: Make E2E server executable
        run: chmod +x apps/server/woottyd

      - name: Install Playwright browsers
        run: pnpm --filter @icoretech/wootty-web exec playwright install --with-deps --only-shell chromium

      - name: Browser E2E tests
        run: pnpm test:e2e:prebuilt
